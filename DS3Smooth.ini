; DS3Smooth settings
; FPS cap. 0 = leave the game's frame rate alone.
fps = 144
; 1 = fix the freeze when a USB device is (dis)connected, 0 = off
stutter_fix = 1
; 1 = fix slow sprinting at high FPS (needs an FPS cap), 0 = off
sprint_fix = 1
; 1 = skip the startup logo screens (start DS3Smooth before the game), 0 = off
no_logo = 1
; 1 = borderless window covering the monitor (set the game to Windowed mode), 0 = off
borderless = 1
