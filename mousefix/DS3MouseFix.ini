[DS3MouseFix]
; Minimum time in ms between mouse-move / set-cursor messages passed to the game.
; 8 = about 125 per second, which keeps menus smooth with any mouse polling rate. 0 = off.
interval_ms = 8
; 1 = show keyboard/mouse icons instead of Xbox buttons (icons are in the DS3KeyIcons folder), 0 = off.
keyboard_icons = 1
; 1 = switch off the game's Arxan anti-tamper checks (they cause ~140 ms hitches about once a minute), 0 = off.
disable_arxan = 1
; 1 = stop the camera turning by itself toward where you run; only the mouse turns it. 0 = the game's auto-follow.
no_camera_auto_follow = 1
; 1 = write DS3MouseFix.log next to the game (what was loaded, and any errors), for troubleshooting. 0 = no log.
; The developer settings below turn it on by themselves.
log = 0
; Developer: 1 = save every texture the game loads to texture_dump\ (for finding the button icons).
dump_textures = 0
; Developer: 1 = log where the game is stuck when frames stop for 40+ ms (DS3MouseFix.log).
stall_trace = 0
; 1 = DLSS anti-aliasing (DLAA) on NVIDIA RTX cards instead of the game's FXAA, 0 = off. Keep Motion Blur ON in the game:
; DLAA uses its motion data (so moving characters don't ghost) and removes the blur itself.
dlaa = 1
; Developer: 1 = save the game's shaders to DS3DLAA\shaders\ and let F9 capture one frame's draw calls to DS3DLAA\capture\.
dlaa_capture = 0
; Developer: 1 = save DLAA's inputs and output for two frames to DS3DLAA\dump\ (after ~5 s of DLAA, on F10, and when
; DLSS's output comes out dark), and log frames drawn without DLSS.
dlaa_dump = 0
; Developer: 1 = pass the jitter to DLSS with the opposite sign (if the image looks soft or shaky with DLAA).
dlaa_jitter_flip = 0
